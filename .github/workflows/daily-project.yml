name: Daily Code Project Generator

on:
  schedule:
    - cron: "37 7 * * *"
  workflow_dispatch:
    inputs:
      force_topic:
        description: "Topic key to force (leave empty for auto-select)"
        required: false
        default: ""
      skip_weekend:
        description: "Skip on weekends"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run generator
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          cd daily-code-generator
          python generate.py

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "lanekingkong"
          git config user.email "lanekingkong@gmail.com"

          if [ -f projects/commit_info.json ]; then
            COMMIT_MSG=$(python -c "import json; f=open('projects/commit_info.json'); d=json.load(f); print(d['commit_message'])")
          else
            COMMIT_MSG="Daily Code Project"
          fi

          git add projects/ projects.json 2>/dev/null || true
          git add .

          if ! git diff --staged --quiet; then
            git commit -m "$COMMIT_MSG"
            git push origin HEAD:main
          else
            echo "No changes to commit."
          fi

      - name: Show status
        run: |
          echo "--- Daily project complete ---"
          cat projects/projects.json 2>/dev/null || echo "First run!"
